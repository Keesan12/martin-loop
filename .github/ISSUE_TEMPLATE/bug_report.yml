name: Bug report
description: Report a reproducible problem in MartinLoop.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: MartinLoop marked a run complete even though the verifier failed.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Share the smallest set of steps or commands that reproduce it.
      placeholder: |
        1. Run `npx martin-loop doctor`
        2. Run `npx martin-loop run ...`
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node version, client or host, and package version.
      placeholder: Windows 11, Node 22, Codex CLI, martin-loop 0.2.7
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Paste the relevant error output, receipts, or screenshots.
      render: shell
