name: Check public prep script

on:
  push:
    branches:
      - public-staging/0.6.1-model-agnostic

jobs:
  check:
    if: contains(github.event.head_commit.message, '[check-public-prep]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: public-staging/0.6.1-model-agnostic
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --check scripts/prepare-public-0.6.1.mjs
