name: test-mcpb

on:
  pull_request:
    paths:
      - '.github/workflows/test-mcpb.yml'
      - '.gitignore'
      - 'packages/mcp/**'
      - 'packages/core/**'
      - 'packages/contracts/**'
      - 'packages/adapters/**'
      - 'packages/policy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcpb:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '24']

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: MCP lint and tests
        run: pnpm --filter @martinloop/mcp lint && pnpm --filter @martinloop/mcp test

      - name: Standalone and npm package smoke tests
        run: pnpm --filter @martinloop/mcp build && pnpm --filter @martinloop/mcp smoke:pack && pnpm --filter @martinloop/mcp smoke:published:pack

      - name: MCP release reliability tests
        run: pnpm --filter @martinloop/mcp verify:release

      - name: Build, validate, and launch MCPB
        run: pnpm --filter @martinloop/mcp mcpb:build && pnpm --filter @martinloop/mcp mcpb:validate && pnpm --filter @martinloop/mcp mcpb:smoke

      - name: Inspect bundle and verify checksum
        shell: pwsh
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import path from 'node:path'; import crypto from 'node:crypto'; const pkg=JSON.parse(fs.readFileSync('packages/mcp/package.json','utf8')); const root='packages/mcp/dist-mcpb'; const bundle=path.join(root,'martinloop-'+pkg.version+'.mcpb'); const sum=bundle+'.sha256'; const required=[path.join(root,'martinloop','manifest.json'),path.join(root,'martinloop','server','dist','server.js'),path.join(root,'martinloop','server','node_modules','@modelcontextprotocol','sdk'),bundle,sum]; for(const p of required){if(!fs.existsSync(p)) throw new Error('missing '+p)} const manifest=fs.readFileSync(required[0],'utf8'); for(const n of ['MARTIN_MCP_WORKSPACE_ROOT','MARTIN_RUNS_DIR','MARTIN_LIVE']) if(!manifest.includes(n)) throw new Error('missing '+n); for(const n of ['MARTIN_WORKSPACE_ROOT','MARTIN_RUNS_ROOT','MARTIN_LIVE_MODE']) if(manifest.includes(n)) throw new Error('legacy env '+n); const expected=fs.readFileSync(sum,'utf8').trim().split(/\s+/)[0]; const actual=crypto.createHash('sha256').update(fs.readFileSync(bundle)).digest('hex'); if(actual!==expected) throw new Error('checksum mismatch'); console.log('bundle inspection passed', {bundle,sha256:actual});"
