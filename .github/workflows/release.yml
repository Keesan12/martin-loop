name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build-native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            asset: martin-loop-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            asset: martin-loop-linux-arm64
          - target: macos-x64
            runner: macos-13
            asset: martin-loop-macos-x64
          - target: macos-arm64
            runner: macos-latest
            asset: martin-loop-macos-arm64
          - target: win-x64
            runner: windows-latest
            asset: martin-loop-win-x64.exe
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build

      - name: Build native asset
        run: node ./scripts/build-native.mjs --skip-build
        env:
          NATIVE_TARGET: ${{ matrix.target }}

      - name: Verify native asset and checksum
        run: node ./scripts/verify-native-release-assets.mjs --target=${{ matrix.target }} --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/native/${{ matrix.asset }}
            dist/native/${{ matrix.asset }}.sha256

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Use latest npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OSS release surface
        run: |
          pnpm lint
          pnpm public:copy-scan
          pnpm public:portability-guard
          pnpm public:git-surface
          pnpm test
          pnpm build
          pnpm oss:validate
          pnpm public:smoke
          pnpm --filter @martinloop/mcp lint
          pnpm --filter @martinloop/mcp test
          pnpm --filter @martinloop/mcp build
          pnpm --filter @martinloop/mcp smoke:pack
          pnpm --filter @martinloop/mcp smoke:published:pack
          pnpm --filter @martinloop/mcp verify:release
          node ./scripts/root-release-guard.mjs --tag "${GITHUB_REF_NAME}" --pack

      - name: Pack root tarball
        id: root-pack
        run: |
          PACK_RESULT="$(node ./scripts/pack-root-release.mjs --output-dir dist-release)"
          printf '%s\n' "$PACK_RESULT" > dist-release/pack-result.json
          TARBALL="$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('dist-release/pack-result.json', 'utf8')); process.stdout.write(data.tarballPath);")"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Download native release assets
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true

      - name: Verify complete native release asset set
        run: node ./scripts/verify-native-release-assets.mjs

      - name: Read package version
        id: package-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          BODY="$(node ./scripts/extract-changelog-entry.mjs --version "${{ steps.package-version.outputs.version }}")"
          {
            echo "body<<EOF_CHANGELOG"
            printf '%s\n' "$BODY"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - name: Check npm for existing version
        id: npm-version
        run: |
          if npm view "martin-loop@${{ steps.package-version.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish "${{ steps.root-pack.outputs.tarball }}" --access public --provenance

      - name: Skip duplicate npm publish
        if: steps.npm-version.outputs.exists == 'true'
        run: echo "martin-loop@${{ steps.package-version.outputs.version }} already exists on npm; skipping publish."

      - name: Verify npm availability
        run: |
          for attempt in 1 2 3 4 5; do
            if npm view "martin-loop@${{ steps.package-version.outputs.version }}" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "martin-loop@${{ steps.package-version.outputs.version }} did not become visible on npm in time."
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ steps.root-pack.outputs.tarball }}
            install.sh
            install.ps1
            dist/native/martin-loop-linux-x64
            dist/native/martin-loop-linux-x64.sha256
            dist/native/martin-loop-linux-arm64
            dist/native/martin-loop-linux-arm64.sha256
            dist/native/martin-loop-macos-x64
            dist/native/martin-loop-macos-x64.sha256
            dist/native/martin-loop-macos-arm64
            dist/native/martin-loop-macos-arm64.sha256
            dist/native/martin-loop-win-x64.exe
            dist/native/martin-loop-win-x64.exe.sha256
          body: ${{ steps.changelog.outputs.body }}
