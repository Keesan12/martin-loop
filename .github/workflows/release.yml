name: Release

on:
  workflow_run:
    workflows:
      - "Validate and cut paired release tags"
    types:
      - completed
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit already bound by both release tags
        required: true
        type: string
      version:
        description: Existing paired-tag semantic version
        required: true
        type: string
      failed_run_id:
        description: Failed root publisher run that authorizes partial-release recovery
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    if: >-
      github.repository == 'Keesan12/martin-loop' &&
      ((github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || 'main' }}
          fetch-depth: 0

      - name: Resolve release coordinates
        id: release-vars
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          RELEASE_TAG="v${VERSION}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify paired tags resolve to authorized release source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-vars.outputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          git fetch origin main
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git fetch --force origin "refs/tags/mcp-v${VERSION}:refs/tags/mcp-v${VERSION}"
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          MCP_TAG_SHA="$(git rev-list -n 1 "mcp-v${VERSION}")"
          MAIN_SHA="$(git rev-parse origin/main)"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$TAG_SHA"
          test "$TAG_SHA" = "$MCP_TAG_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$FAILED_RUN_ID" =~ ^[0-9]+$ ]]
            test "$HEAD_SHA" = "$CANDIDATE_SHA"
            git merge-base --is-ancestor "$CANDIDATE_SHA" "$MAIN_SHA"
            FAILED_RUN_NAME="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}" --jq .name)"
            FAILED_RUN_EVENT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}" --jq .event)"
            FAILED_RUN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}" --jq .head_sha)"
            FAILED_RUN_CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}" --jq .conclusion)"
            test "$FAILED_RUN_NAME" = "Release"
            test "$FAILED_RUN_CONCLUSION" = "failure"
            TOTAL_FAILED_STEPS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs?filter=latest" --jq '[.jobs[] | .steps[] | select(.conclusion == "failure")] | length')"
            test "$TOTAL_FAILED_STEPS" = "1"
            FAILED_PACK_STEPS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs?filter=latest" --jq '[.jobs[] | select(.name == "Publish to npm") | .steps[] | select(.name == "Pack root tarball" and .conclusion == "failure")] | length')"
            FAILED_AVAILABILITY_STEPS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs?filter=latest" --jq '[.jobs[] | select(.name == "Publish to npm") | .steps[] | select(.name == "Verify npm availability" and .conclusion == "failure")] | length')"
            SUCCESSFUL_AUTHORITY_STEPS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs?filter=latest" --jq '[.jobs[] | select(.name == "Publish to npm") | .steps[] | select(.name == "Verify paired tags resolve to authorized release source" and .conclusion == "success")] | length')"
            SUCCESSFUL_PUBLISH_STEPS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs?filter=latest" --jq '[.jobs[] | select(.name == "Publish to npm") | .steps[] | select(.name == "Publish to npm" and .conclusion == "success")] | length')"
            test "$(npm view "@martinloop/mcp@$VERSION" version)" = "$VERSION"
            if [[ "$FAILED_RUN_EVENT" == "workflow_run" && "$FAILED_RUN_SHA" == "$CANDIDATE_SHA" && "$FAILED_PACK_STEPS" == "1" ]]; then
              if npm view "martin-loop@$VERSION" version >/dev/null 2>&1; then
                echo "Root package already exists; pre-publication recovery is not authorized."
                exit 1
              fi
            elif [[ "$FAILED_RUN_EVENT" == "workflow_dispatch" && "$FAILED_AVAILABILITY_STEPS" == "1" && "$SUCCESSFUL_AUTHORITY_STEPS" == "1" && "$SUCCESSFUL_PUBLISH_STEPS" == "1" ]]; then
              git merge-base --is-ancestor "$FAILED_RUN_SHA" "$MAIN_SHA"
              test "$(npm view "martin-loop@$VERSION" version)" = "$VERSION"
            else
              echo "Failed run does not match an authorized root recovery state."
              exit 1
            fi
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Root GitHub release already exists; partial-publication recovery is not authorized."
              exit 1
            fi
          else
            test "$TAG_SHA" = "$MAIN_SHA"
          fi

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use npm 11.5.1 for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OSS release surface
        run: |
          pnpm release:clean-check
          pnpm release:authority:check
          pnpm build
          pnpm lint
          pnpm public:copy-scan
          pnpm public:portability-guard
          pnpm public:git-surface
          pnpm test
          pnpm release:authority:check:built
          pnpm oss:validate
          pnpm public:smoke
          node ./scripts/root-release-guard.mjs --tag "${{ steps.release-vars.outputs.tag }}" --pack
          pnpm release:clean-check

      - name: Normalize npm provenance repository metadata
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.repository = { type: 'git', url: 'https://github.com/Keesan12/martin-loop' };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Pack root tarball
        id: root-pack
        shell: bash
        run: |
          rm -rf dist-release
          mkdir -p dist-release
          npm pack --ignore-scripts --json --pack-destination dist-release > "$RUNNER_TEMP/martin-loop-root-pack.json"
          mapfile -t TARBALLS < <(find dist-release -maxdepth 1 -type f -name '*.tgz' -print | sort)
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "npm pack produced ${#TARBALLS[@]} tarballs; expected exactly one."
            cat "$RUNNER_TEMP/martin-loop-root-pack.json" || true
            exit 1
          fi
          echo "tarball=./${TARBALLS[0]#./}" >> "$GITHUB_OUTPUT"
          git restore --source=HEAD -- package.json
          pnpm release:clean-check

      - name: Read package version
        id: package-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          BODY="$(node ./scripts/extract-changelog-entry.mjs --version "${{ steps.package-version.outputs.version }}")"
          {
            echo "body<<EOF_CHANGELOG"
            printf '%s\n' "$BODY"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - name: Check npm for existing version
        id: npm-version
        run: |
          if npm view "martin-loop@${{ steps.package-version.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify existing npm artifact matches release tarball
        if: steps.npm-version.outputs.exists == 'true'
        shell: bash
        run: |
          LOCAL_SHASUM="$(sha1sum "${{ steps.root-pack.outputs.tarball }}" | awk '{print $1}')"
          REMOTE_SHASUM="$(npm view "martin-loop@${{ steps.package-version.outputs.version }}" dist.shasum)"
          test "$LOCAL_SHASUM" = "$REMOTE_SHASUM"

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish "${{ steps.root-pack.outputs.tarball }}" --access public --provenance

      - name: Skip duplicate npm publish
        if: steps.npm-version.outputs.exists == 'true'
        run: echo "martin-loop@${{ steps.package-version.outputs.version }} already exists on npm; skipping publish."

      - name: Verify npm availability
        run: |
          for attempt in 1 2 3 4 5; do
            if npm view "martin-loop@${{ steps.package-version.outputs.version }}" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "martin-loop@${{ steps.package-version.outputs.version }} did not become visible on npm in time."
          exit 1

      - name: Verify published root artifact E2E
        run: node ./scripts/published-artifact-e2e.mjs --package-spec "martin-loop@${{ steps.package-version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ steps.release-vars.outputs.tag }}
          files: ${{ steps.root-pack.outputs.tarball }}
          body: ${{ steps.changelog.outputs.body }}
