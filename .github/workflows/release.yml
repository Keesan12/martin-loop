name: Release

on:
  workflow_run:
    workflows:
      - "Validate and cut paired release tags"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' || github.event_name == 'push') && github.repository == 'Keesan12/martin-loop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && 'v0.6.6' || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release coordinates
        id: release-vars
        shell: bash
        env:
          VALIDATED_RELEASE_SHA: ${{ github.event_name == 'push' && '56a57fd823b4815a0774e9436a74e16dd97e4494' || github.event.workflow_run.head_sha }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v${VERSION}"
          test "$(git rev-parse HEAD)" = "$VALIDATED_RELEASE_SHA"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify paired tags resolve to current public main
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-vars.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          VALIDATED_RELEASE_SHA: ${{ github.event_name == 'push' && '56a57fd823b4815a0774e9436a74e16dd97e4494' || github.event.workflow_run.head_sha }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          git fetch --force origin "refs/tags/mcp-v${VERSION}:refs/tags/mcp-v${VERSION}"
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          MCP_TAG_SHA="$(git rev-list -n 1 "mcp-v${VERSION}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$TAG_SHA"
          test "$TAG_SHA" = "$MCP_TAG_SHA"
          if [[ "$EVENT_NAME" == "push" ]]; then
            node scripts/release-recovery-state.mjs --publisher-coordinates \
              --validated-sha "$VALIDATED_RELEASE_SHA" \
              --tag-sha "$TAG_SHA" \
              --paired-tag-sha "$MCP_TAG_SHA" \
              --recovery-state RETRY_PUBLISH_SAME_VALIDATED_TAG
          else
            git fetch origin main
            MAIN_SHA="$(git rev-parse origin/main)"
            test "$TAG_SHA" = "$MAIN_SHA"
          fi

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OSS release surface
        run: |
          pnpm release:clean-check
          pnpm release:authority:check
          pnpm build
          pnpm lint
          pnpm public:copy-scan
          pnpm public:portability-guard
          pnpm public:git-surface
          pnpm test
          pnpm release:authority:check:built
          pnpm oss:validate
          pnpm public:smoke
          node ./scripts/root-release-guard.mjs --tag "${{ steps.release-vars.outputs.tag }}" --pack
          pnpm release:clean-check

      - name: Normalize npm provenance repository metadata
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.repository = { type: 'git', url: 'https://github.com/Keesan12/martin-loop' };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Pack root tarball
        id: root-pack
        shell: bash
        run: |
          rm -rf dist-release
          mkdir -p dist-release
          npm pack --json --pack-destination dist-release > "$RUNNER_TEMP/martin-loop-root-pack.json"
          mapfile -t TARBALLS < <(find dist-release -maxdepth 1 -type f -name '*.tgz' -print | sort)
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "npm pack produced ${#TARBALLS[@]} tarballs; expected exactly one."
            cat "$RUNNER_TEMP/martin-loop-root-pack.json" || true
            exit 1
          fi
          echo "tarball=./${TARBALLS[0]#./}" >> "$GITHUB_OUTPUT"

      - name: Read package version
        id: package-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          if ! BODY="$(node ./scripts/extract-changelog-entry.mjs --version "${{ steps.package-version.outputs.version }}")"; then
            BODY="$(cat "docs/release/OSS-${{ steps.package-version.outputs.version }}-RELEASE-NOTES.md")"
          fi
          {
            echo "body<<EOF_CHANGELOG"
            printf '%s\n' "$BODY"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - name: Check npm for existing version
        id: npm-version
        run: |
          if npm view "martin-loop@${{ steps.package-version.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use latest npm for trusted publishing
        if: steps.npm-version.outputs.exists != 'true'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish "${{ steps.root-pack.outputs.tarball }}" --access public --provenance

      - name: Skip duplicate npm publish
        if: steps.npm-version.outputs.exists == 'true'
        run: echo "martin-loop@${{ steps.package-version.outputs.version }} already exists on npm; skipping publish."

      - name: Verify npm availability
        run: |
          for attempt in 1 2 3 4 5; do
            if npm view "martin-loop@${{ steps.package-version.outputs.version }}" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "martin-loop@${{ steps.package-version.outputs.version }} did not become visible on npm in time."
          exit 1

      - name: Verify published root artifact E2E
        run: node ./scripts/published-artifact-e2e.mjs --package-spec "martin-loop@${{ steps.package-version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ steps.release-vars.outputs.tag }}
          files: ${{ steps.root-pack.outputs.tarball }}
          body: ${{ steps.changelog.outputs.body }}
