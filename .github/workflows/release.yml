name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string
      validated_release_sha:
        description: SHA that passed the complete pre-tag gate
        required: true
        type: string
      recovery_state:
        description: Authorized release recovery state
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release invocation
        id: invocation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VALIDATED_RELEASE_SHA: ${{ inputs.validated_release_sha }}
          INPUT_RECOVERY_STATE: ${{ inputs.recovery_state }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="v0.6.5"
            VALIDATED_RELEASE_SHA="2f6da7e2788bed46092910d02253b9d29b4e9c63"
            RECOVERY_STATE="RETRY_PUBLISH_SAME_VALIDATED_TAG"
          else
            TAG="$INPUT_TAG"
            VALIDATED_RELEASE_SHA="$INPUT_VALIDATED_RELEASE_SHA"
            RECOVERY_STATE="$INPUT_RECOVERY_STATE"
          fi
          test -n "$TAG"
          test -n "$VALIDATED_RELEASE_SHA"
          test -n "$RECOVERY_STATE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "validated_release_sha=$VALIDATED_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "recovery_state=$RECOVERY_STATE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.invocation.outputs.tag }}
          fetch-depth: 0

      - name: Verify validated root and MCP source coordinates
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.invocation.outputs.tag }}
          VALIDATED_RELEASE_SHA: ${{ steps.invocation.outputs.validated_release_sha }}
          RECOVERY_STATE: ${{ steps.invocation.outputs.recovery_state }}
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo "Expected vX.Y.Z tag"; exit 1; }
          VERSION="${RELEASE_TAG#v}"
          git fetch --force origin "refs/tags/mcp-v${VERSION}:refs/tags/mcp-v${VERSION}"
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          MCP_TAG_SHA="$(git rev-list -n 1 "mcp-v${VERSION}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$TAG_SHA"
          node scripts/release-recovery-state.mjs --publisher-coordinates --validated-sha "$VALIDATED_RELEASE_SHA" --tag-sha "$TAG_SHA" --paired-tag-sha "$MCP_TAG_SHA" --recovery-state "$RECOVERY_STATE"

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OSS release surface
        run: |
          pnpm release:clean-check
          pnpm release:authority:check
          pnpm build
          pnpm lint
          pnpm public:copy-scan
          pnpm public:portability-guard
          pnpm public:git-surface
          pnpm test
          pnpm release:authority:check:built
          pnpm oss:validate
          pnpm public:smoke
          node ./scripts/root-release-guard.mjs --tag "${{ steps.invocation.outputs.tag }}" --pack
          pnpm release:clean-check

      - name: Normalize npm provenance repository metadata
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.repository = { type: 'git', url: 'https://github.com/Keesan12/martin-loop' };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Pack root tarball
        id: root-pack
        shell: bash
        run: |
          rm -rf dist-release
          mkdir -p dist-release
          npm pack --json --pack-destination dist-release > "$RUNNER_TEMP/martin-loop-root-pack.json"
          mapfile -t TARBALLS < <(find dist-release -maxdepth 1 -type f -name '*.tgz' -print | sort)
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "npm pack produced ${#TARBALLS[@]} tarballs; expected exactly one."
            cat "$RUNNER_TEMP/martin-loop-root-pack.json" || true
            exit 1
          fi
          echo "tarball=./${TARBALLS[0]#./}" >> "$GITHUB_OUTPUT"

      - name: Read package version
        id: package-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          BODY="$(node ./scripts/extract-changelog-entry.mjs --version "${{ steps.package-version.outputs.version }}")"
          {
            echo "body<<EOF_CHANGELOG"
            printf '%s\n' "$BODY"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - name: Check npm for existing version
        id: npm-version
        run: |
          if npm view "martin-loop@${{ steps.package-version.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use latest npm for trusted publishing
        if: steps.npm-version.outputs.exists != 'true'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish "${{ steps.root-pack.outputs.tarball }}" --access public --provenance

      - name: Skip duplicate npm publish
        if: steps.npm-version.outputs.exists == 'true'
        run: echo "martin-loop@${{ steps.package-version.outputs.version }} already exists on npm; skipping publish."

      - name: Verify npm availability
        run: |
          for attempt in 1 2 3 4 5; do
            if npm view "martin-loop@${{ steps.package-version.outputs.version }}" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "martin-loop@${{ steps.package-version.outputs.version }} did not become visible on npm in time."
          exit 1

      - name: Verify published root artifact E2E
        run: node ./scripts/published-artifact-e2e.mjs --package-spec "martin-loop@${{ steps.package-version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ steps.invocation.outputs.tag }}
          files: ${{ steps.root-pack.outputs.tarball }}
          body: ${{ steps.changelog.outputs.body }}
