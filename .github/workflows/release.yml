name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release coordinates
        id: release-vars
        shell: bash
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          RELEASE_TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Missing release tag."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Expected a vX.Y.Z tag"
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-vars.outputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Use latest npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OSS release surface
        run: |
          pnpm build
          pnpm lint
          pnpm public:copy-scan
          pnpm public:portability-guard
          pnpm public:git-surface
          pnpm test
          pnpm oss:validate
          pnpm public:smoke
          pnpm --filter @martinloop/mcp lint
          pnpm --filter @martinloop/mcp test
          pnpm --filter @martinloop/mcp build
          pnpm --filter @martinloop/mcp smoke:pack
          pnpm --filter @martinloop/mcp smoke:published:pack
          pnpm --filter @martinloop/mcp verify:release
          node ./scripts/root-release-guard.mjs --tag "${{ steps.release-vars.outputs.tag }}" --pack

      - name: Build, validate, and smoke-test MCPB
        run: |
          pnpm --filter @martinloop/mcp mcpb:build
          pnpm --filter @martinloop/mcp mcpb:validate
          pnpm --filter @martinloop/mcp mcpb:smoke

      - name: Pack root tarball
        id: root-pack
        run: |
          PACK_RESULT="$(node ./scripts/pack-root-release.mjs --output-dir dist-release)"
          printf '%s\n' "$PACK_RESULT" > dist-release/pack-result.json
          TARBALL="$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('dist-release/pack-result.json', 'utf8')); process.stdout.write(data.tarballPath);")"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Read package version
        id: package-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${{ steps.release-vars.outputs.version }}" ]; then
            echo "Tag ${{ steps.release-vars.outputs.tag }} does not match package.json version ${VERSION}."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          BODY="$(node ./scripts/extract-changelog-entry.mjs --version "${{ steps.package-version.outputs.version }}")"
          {
            echo "body<<EOF_CHANGELOG"
            printf '%s\n' "$BODY"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - name: Check npm for existing version
        id: npm-version
        run: |
          if npm view "martin-loop@${{ steps.package-version.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish "${{ steps.root-pack.outputs.tarball }}" --access public --provenance

      - name: Skip duplicate npm publish
        if: steps.npm-version.outputs.exists == 'true'
        run: echo "martin-loop@${{ steps.package-version.outputs.version }} already exists on npm; skipping publish."

      - name: Verify npm availability
        run: |
          for attempt in 1 2 3 4 5; do
            if npm view "martin-loop@${{ steps.package-version.outputs.version }}" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "martin-loop@${{ steps.package-version.outputs.version }} did not become visible on npm in time."
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ steps.release-vars.outputs.tag }}
          files: |
            ${{ steps.root-pack.outputs.tarball }}
            packages/mcp/dist-mcpb/martinloop-*.mcpb
            packages/mcp/dist-mcpb/martinloop-*.mcpb.sha256
          body: ${{ steps.changelog.outputs.body }}
