name: release-053-test-cleanup

on:
  push:
    branches:
      - release/0.5.3

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.5.3
          fetch-depth: 0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Remove obsolete static Codex tests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const testPath = 'packages/adapters/tests/claude-cli.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          const start = '// ---------------------------------------------------------------------------\n// Codex-specific factory\n// ---------------------------------------------------------------------------\n';
          const end = '// ---------------------------------------------------------------------------\n// Gemini-specific factory\n// ---------------------------------------------------------------------------\n';
          const startIndex = test.indexOf(start);
          const endIndex = test.indexOf(end);
          if (startIndex < 0 || endIndex < 0 || endIndex <= startIndex) {
            throw new Error('Could not locate the exact legacy Codex test block.');
          }

          const preservedClaudeGuard = `// Regression guard: Claude token limits are enforced by the streaming budget circuit breaker,\n// not by inventing a subprocess --max-tokens flag.\ndescribe("Claude subprocess token flag contract", () => {\n  it("enforces token guardrails via streamingUsageCap, not --max-tokens subprocess flag", async () => {\n    const calls: SpawnCall[] = [];\n    const adapter = createClaudeCliAdapter({\n      spawnImpl: createScriptedSpawn(calls)\n    });\n\n    const result = await adapter.execute(makeRequest());\n\n    expect(result.status).toBe("completed");\n    expect(calls[0]?.args).not.toContain("--max-tokens");\n  });\n});\n\n`;

          test = test.slice(0, startIndex) + preservedClaudeGuard + test.slice(endIndex);
          test = test.replace('  createCodexCliAdapter,\n', '');
          fs.writeFileSync(testPath, test);

          const lanePath = 'packages/adapters/scripts/run-test-lane.mjs';
          let lane = fs.readFileSync(lanePath, 'utf8');
          const legacyStart = '// These six legacy assertions encoded one static Codex argv contract.';
          const legacyEnd = 'const commands =';
          const legacyStartIndex = lane.indexOf(legacyStart);
          const legacyEndIndex = lane.indexOf(legacyEnd);
          if (legacyStartIndex < 0 || legacyEndIndex < 0 || legacyEndIndex <= legacyStartIndex) {
            throw new Error('Could not locate the exact legacy Codex exclusion block.');
          }
          lane = lane.slice(0, legacyStartIndex) + lane.slice(legacyEndIndex);
          lane = lane.replace('`^(?!.*(${baselineExclusionPattern})).*$`', '`^(?!.*(${heavyClaudeCliPattern})).*$`');
          fs.writeFileSync(lanePath, lane);
          NODE

      - name: Verify stale assumptions are gone
        shell: bash
        run: |
          ! grep -F -- '--approve-for-me' packages/adapters/tests/claude-cli.test.ts
          ! grep -F 'legacyStaticCodexPattern' packages/adapters/scripts/run-test-lane.mjs
          grep -F 'capability-driven Codex adapter' packages/adapters/tests/codex-cli.test.ts
          git diff --check

      - name: Install and test adapters
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @martin/adapters lint
          pnpm --filter @martin/adapters test:baseline

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/adapters/tests/claude-cli.test.ts packages/adapters/scripts/run-test-lane.mjs
          git commit -m 'test(adapters): remove obsolete static Codex contract tests'
          git push origin HEAD:release/0.5.3
