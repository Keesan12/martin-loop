name: platform-release-validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  platform-release-validation:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Run multi-platform release validation
        env:
          MARTIN_RELEASE_MATRIX_OUTDIR: ${{ runner.temp }}/release-matrix/${{ matrix.os }}
        run: |
          pnpm release:clean-check
          node ./scripts/fleet-release-authority-check.mjs --source
          node ./scripts/release-truth-check.mjs --allow-divergence-marker=[sync-parity]
          node ./scripts/release-matrix.mjs
          node ./scripts/fleet-release-authority-check.mjs --built
          pnpm release:clean-check

      - name: Upload platform validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: platform-release-validation-${{ matrix.os }}
          path: ${{ runner.temp }}/release-matrix/${{ matrix.os }}
