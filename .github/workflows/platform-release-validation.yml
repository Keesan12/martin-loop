name: platform-release-validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  platform-release-validation:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Run multi-platform release validation
        env:
          MARTIN_RELEASE_MATRIX_OUTDIR: ${{ runner.temp }}/release-matrix/${{ matrix.os }}
        run: |
          pnpm release:clean-check
          node ./scripts/fleet-release-authority-check.mjs --source
          node ./scripts/release-truth-check.mjs --allow-divergence-marker=[sync-parity]
          node ./scripts/release-matrix.mjs
          node ./scripts/fleet-release-authority-check.mjs --built
          pnpm release:clean-check

      - name: Upload platform validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-release-validation-${{ matrix.os }}
          path: ${{ runner.temp }}/release-matrix/${{ matrix.os }}
