name: MartinLoop Budget Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  martinloop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run MartinLoop budget gate
        env:
          MARTIN_LIVE: "false"
        run: |
          pnpm run:cli -- run \
            --cwd "$GITHUB_WORKSPACE" \
            --config examples/github-actions-budget-gate/martin.config.yaml \
            --workspace gh_budget_gate \
            --project martinloop_examples \
            --objective "Summarize the current repo state and stay inside the configured CI budget gate" \
            --verify "pnpm --filter @martin/core test" \
            --metadata trigger=github-actions \
            --metadata example=budget-gate

      - name: Inspect persisted run record
        run: |
          pnpm run:cli -- inspect --file "$HOME/.martin/runs/gh_budget_gate.jsonl"

      - name: Upload run record artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: martinloop-budget-gate-run-record
          path: ~/.martin/runs/gh_budget_gate.jsonl
          if-no-files-found: warn
