name: Add Glama related servers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-glama-related.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add related MCP servers
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          anchor = "</div>\n\nRun the standalone MCP package directly:"
          block = """</div>\n\nRelated MCP servers commonly used alongside MartinLoop:\n\n- [GitHub MCP Server](https://glama.ai/mcp/servers/github/github-mcp-server) for repository, issue, and pull-request operations.\n- [Git MCP server](https://glama.ai/mcp/servers/modelcontextprotocol/git) for local repository inspection and version-control actions.\n- [Playwright MCP](https://glama.ai/mcp/servers/microsoft/playwright-mcp) for browser-based verification and end-to-end testing.\n\nRun the standalone MCP package directly:"""
          if "Related MCP servers commonly used alongside MartinLoop:" not in text:
              if anchor not in text:
                  raise SystemExit("MCP card anchor not found")
              text = text.replace(anchor, block, 1)
          readme.write_text(text, encoding="utf-8")
          Path(".github/workflows/apply-glama-related.yml").unlink()
          PY
      - name: Commit related server links and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/apply-glama-related.yml
          git commit -m "docs: add related MCP servers"
          git push origin HEAD:main
