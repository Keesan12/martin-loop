name: Validate and cut paired release tags

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full public commit SHA to validate and tag
        required: true
        type: string
      version:
        description: Root and MCP semantic version
        required: true
        type: string
      retry_run_id:
        description: Prior controller run ID; accepted only when GitHub proves an infrastructure-only failure
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  publisher-equivalent-validation:
    if: github.repository == 'Keesan12/martin-loop'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      validated_release_sha: ${{ steps.coordinates.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Validate exact main candidate SHA and full publisher matrix
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/pre-tag-release-gate.mjs --candidate-sha "$CANDIDATE_SHA" --output pre-tag-attestation.json
      - name: Bind validated coordinate
        id: coordinates
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: pre-tag-attestation
          path: pre-tag-attestation.json

  atomic-tag-coordinates:
    needs: publisher-equivalent-validation
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    outputs:
      recovery_state: ${{ steps.tags.outputs.state }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: pre-tag-attestation
      - name: Create or authorize paired coordinates
        id: tags
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.publisher-equivalent-validation.outputs.validated_release_sha }}
          VERSION: ${{ inputs.version }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/query-release-publication-state.mjs --version "$VERSION" --output publication-state.json
          FAILURE_KIND=initial
          if [[ -n "$RETRY_RUN_ID" ]]; then
            node scripts/verify-infrastructure-retry.mjs --run-id "$RETRY_RUN_ID" --candidate-sha "$CANDIDATE_SHA"
            FAILURE_KIND=infrastructure
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          OUTPUT="$(node scripts/cut-release-tags.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --version "$VERSION" \
            --failure-kind "$FAILURE_KIND" \
            --attestation pre-tag-attestation.json \
            --publication-evidence publication-state.json)"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          printf '%s\n' "$OUTPUT"
          STATE="$(printf '%s\n' "$OUTPUT" | sed -n 's/^DISPATCH_STATE=//p')"
          test -n "$STATE"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

  publish-root:
    needs: [publisher-equivalent-validation, atomic-tag-coordinates]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ inputs.version }}
      validated_release_sha: ${{ needs.publisher-equivalent-validation.outputs.validated_release_sha }}
      recovery_state: ${{ needs.atomic-tag-coordinates.outputs.recovery_state }}
    secrets: inherit

  publish-mcp:
    needs: [publisher-equivalent-validation, atomic-tag-coordinates]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-mcp.yml
    with:
      tag: mcp-v${{ inputs.version }}
      validated_release_sha: ${{ needs.publisher-equivalent-validation.outputs.validated_release_sha }}
      recovery_state: ${{ needs.atomic-tag-coordinates.outputs.recovery_state }}
    secrets: inherit
