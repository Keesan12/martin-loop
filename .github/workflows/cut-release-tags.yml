name: Cut Release Tags

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  cut-release-tags:
    name: Cut root and MCP release tags
    if: contains(github.event.head_commit.message, '[cut-release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release coordinates
        id: versions
        shell: bash
        run: |
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          MCP_VERSION="$(node -p "require('./packages/mcp/package.json').version")"
          MCP_SERVER_VERSION="$(node -p "require('./packages/mcp/server.json').version")"
          MCPB_VERSION="$(node -p "require('./packages/mcp/mcpb/manifest.json').version")"

          if [ "$MCP_VERSION" != "$MCP_SERVER_VERSION" ]; then
            echo "MCP package/server version mismatch: ${MCP_VERSION} != ${MCP_SERVER_VERSION}"
            exit 1
          fi
          if [ "$MCP_VERSION" != "$MCPB_VERSION" ]; then
            echo "MCP package/MCPB version mismatch: ${MCP_VERSION} != ${MCPB_VERSION}"
            exit 1
          fi

          test -f "docs/release/OSS-${ROOT_VERSION}-RELEASE-NOTES.md"
          test -f "docs/release/MCP-${MCP_VERSION}-RELEASE-NOTES.md"
          node ./scripts/extract-changelog-entry.mjs --version "$ROOT_VERSION" >/dev/null

          echo "root_version=${ROOT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mcp_version=${MCP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Refuse to move existing release tags
        shell: bash
        run: |
          git fetch --tags --force
          ROOT_TAG="v${{ steps.versions.outputs.root_version }}"
          MCP_TAG="mcp-v${{ steps.versions.outputs.mcp_version }}"

          if git rev-parse -q --verify "refs/tags/${ROOT_TAG}" >/dev/null; then
            echo "Release tag ${ROOT_TAG} already exists. Refusing to move it."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${MCP_TAG}" >/dev/null; then
            echo "Release tag ${MCP_TAG} already exists. Refusing to move it."
            exit 1
          fi

      - name: Create immutable release tags at this commit
        shell: bash
        run: |
          ROOT_TAG="v${{ steps.versions.outputs.root_version }}"
          MCP_TAG="mcp-v${{ steps.versions.outputs.mcp_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$ROOT_TAG" "$GITHUB_SHA" -m "MartinLoop ${{ steps.versions.outputs.root_version }}"
          git tag -a "$MCP_TAG" "$GITHUB_SHA" -m "@martinloop/mcp ${{ steps.versions.outputs.mcp_version }}"
          git push origin "$ROOT_TAG" "$MCP_TAG"

      - name: Verify tag commit parity
        shell: bash
        run: |
          ROOT_TAG="v${{ steps.versions.outputs.root_version }}"
          MCP_TAG="mcp-v${{ steps.versions.outputs.mcp_version }}"
          test "$(git rev-parse "${ROOT_TAG}^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse "${MCP_TAG}^{commit}")" = "$GITHUB_SHA"

      - name: Dispatch trusted publishers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref main -f tag="v${{ steps.versions.outputs.root_version }}"
          gh workflow run publish-mcp.yml --ref main -f tag="mcp-v${{ steps.versions.outputs.mcp_version }}"

  publish-existing-release-tags:
    name: Publish existing immutable release tags
    if: contains(github.event.head_commit.message, '[publish-existing-release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and verify existing release tags
        id: existing
        shell: bash
        run: |
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          MCP_VERSION="$(node -p "require('./packages/mcp/package.json').version")"
          ROOT_TAG="v${ROOT_VERSION}"
          MCP_TAG="mcp-v${MCP_VERSION}"

          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/${ROOT_TAG}" >/dev/null
          git rev-parse -q --verify "refs/tags/${MCP_TAG}" >/dev/null

          ROOT_SHA="$(git rev-parse "${ROOT_TAG}^{commit}")"
          MCP_SHA="$(git rev-parse "${MCP_TAG}^{commit}")"
          if [ "$ROOT_SHA" != "$MCP_SHA" ]; then
            echo "Root and MCP release tags do not resolve to the same commit: ${ROOT_SHA} != ${MCP_SHA}"
            exit 1
          fi

          TAG_ROOT_VERSION="$(git show "${ROOT_TAG}:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          TAG_MCP_VERSION="$(git show "${MCP_TAG}:packages/mcp/package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          TAG_MCP_SERVER_VERSION="$(git show "${MCP_TAG}:packages/mcp/server.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          TAG_MCPB_VERSION="$(git show "${MCP_TAG}:packages/mcp/mcpb/manifest.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"

          test "$TAG_ROOT_VERSION" = "$ROOT_VERSION"
          test "$TAG_MCP_VERSION" = "$MCP_VERSION"
          test "$TAG_MCP_SERVER_VERSION" = "$MCP_VERSION"
          test "$TAG_MCPB_VERSION" = "$MCP_VERSION"
          git cat-file -e "${ROOT_TAG}:docs/release/OSS-${ROOT_VERSION}-RELEASE-NOTES.md"
          git cat-file -e "${MCP_TAG}:docs/release/MCP-${MCP_VERSION}-RELEASE-NOTES.md"

          echo "root_tag=${ROOT_TAG}" >> "$GITHUB_OUTPUT"
          echo "mcp_tag=${MCP_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${ROOT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Dispatch trusted publishers for existing tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Publishing immutable release commit ${{ steps.existing.outputs.release_sha }}"
          gh workflow run release.yml --ref main -f tag="${{ steps.existing.outputs.root_tag }}"
          gh workflow run publish-mcp.yml --ref main -f tag="${{ steps.existing.outputs.mcp_tag }}"

  publish-root-repair:
    name: Publish root release from repaired main
    if: contains(github.event.head_commit.message, '[publish-root-repair]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve root release tag
        id: root
        shell: bash
        run: |
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          ROOT_TAG="v${ROOT_VERSION}"
          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/${ROOT_TAG}" >/dev/null
          TAG_ROOT_VERSION="$(git show "${ROOT_TAG}:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          test "$TAG_ROOT_VERSION" = "$ROOT_VERSION"
          echo "root_tag=${ROOT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Dispatch trusted root publisher from repaired main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag="${{ steps.root.outputs.root_tag }}"

  publish-release-repair:
    name: Publish root and MCP repair lanes
    if: contains(github.event.head_commit.message, '[publish-release-repair]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve existing 0.5.7 release tags
        id: repair
        shell: bash
        run: |
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          MCP_VERSION="$(node -p "require('./packages/mcp/package.json').version")"
          ROOT_TAG="v${ROOT_VERSION}"
          MCP_TAG="mcp-v${MCP_VERSION}"
          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/${ROOT_TAG}" >/dev/null
          git rev-parse -q --verify "refs/tags/${MCP_TAG}" >/dev/null
          test "$(git show "${ROOT_TAG}:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "$ROOT_VERSION"
          test "$(git show "${MCP_TAG}:packages/mcp/package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "$MCP_VERSION"
          test "$(git show "${MCP_TAG}:packages/mcp/mcpb/manifest.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "$MCP_VERSION"
          echo "root_tag=${ROOT_TAG}" >> "$GITHUB_OUTPUT"
          echo "mcp_tag=${MCP_TAG}" >> "$GITHUB_OUTPUT"

      - name: Dispatch repaired trusted publishers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref main -f tag="${{ steps.repair.outputs.root_tag }}"
          gh workflow run publish-mcp.yml --ref main -f tag="${{ steps.repair.outputs.mcp_tag }}"
