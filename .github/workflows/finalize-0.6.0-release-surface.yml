name: Finalize 0.6.0 Release Surface

on:
  push:
    branches:
      - public-staging/0.6.0-20260906

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[apply-release-surface]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: public-staging/0.6.0-20260906
          fetch-depth: 0
      - name: Apply reviewed public release surface
        shell: bash
        run: |
          cat > /tmp/readme.patch <<'PATCH'
          diff --git a/README.md b/README.md
          --- a/README.md
          +++ b/README.md
          @@ -157,7 +157,7 @@
           `share --latest` writes three files into the selected run directory under `share/`: `run-receipt.json`, `run-receipt.md`, and `proof-card.svg`.
           
          -Release notes for the current root package: [MartinLoop 0.5.7](./docs/release/OSS-0.5.7-RELEASE-NOTES.md).
          +Release notes for MartinLoop 0.6.0: [MartinLoop 0.6.0](./docs/release/OSS-0.6.0-RELEASE-NOTES.md).
           
           ## The Run From Start to Handoff
          @@ -222,17 +222,17 @@
           Use this lane from a clean temp directory to verify the public CLI flow exactly as shipped:
           
           ```sh
          -npx -y martin-loop@0.5.6 --version
          -npx -y martin-loop@0.5.6 start
          -npx -y martin-loop@0.5.6 demo
          +npx -y martin-loop@0.6.0 --version
          +npx -y martin-loop@0.6.0 start
          +npx -y martin-loop@0.6.0 demo
           cd martin-loop-demo
           npm install
          -npx -y martin-loop@0.5.6 run "Summarize the demo workspace and prove tests still pass" --verify "npm test" --budget-usd 2 --max-iterations 1 --json
          -npx -y martin-loop@0.5.6 dossier --latest --json
          -npx -y martin-loop@0.5.6 share --latest --json
          +npx -y martin-loop@0.6.0 run "Summarize the demo workspace and prove tests still pass" --verify "npm test" --budget-usd 2 --max-iterations 1 --json
          +npx -y martin-loop@0.6.0 dossier --latest --json
          +npx -y martin-loop@0.6.0 share --latest --json
           ```
           
          -For deterministic installs, pin the package line (`martin-loop@0.5.7`) or use `martin-loop@latest`. Plain `npx martin-loop` can resolve a stale local cache on some machines.
          +For deterministic installs, pin the package line (`martin-loop@0.6.0`) or use `martin-loop@latest`. Plain `npx martin-loop` can resolve a stale local cache on some machines.
          @@ -317,13 +317,10 @@
           <!-- Generated by scripts/generate-install-links.mjs. -->
          -<!-- MCP package: @martinloop/mcp@0.5.7 -->
          +<!-- MCP package: @martinloop/mcp@0.6.0 -->
           
          -[![Install in VS Code](https://img.shields.io/badge/VS_Code-Install_MartinLoop-007ACC?logo=visualstudiocode&logoColor=white)](vscode:mcp/install?%7B%22name%22%3A%22martin-loop%22%2C%22command%22%3A%22npx%22%2C%22args%22%3A%5B%22-y%22%2C%22%40martinloop%2Fmcp%400.5.7%22%5D%7D)
          -[![Add to Cursor](https://img.shields.io/badge/Cursor-Add_MartinLoop-111111)](cursor://anysphere.cursor-deeplink/mcp/install?name=martin-loop&config=eyJjb21tYW5kIjoibnB4IiwiYXJncyI6WyIteSIsIkBtYXJ0aW5sb29wL21jcEAwLjUuNyJdfQ%3D%3D)
          -
          -[![Install in VS Code](https://img.shields.io/badge/VS_Code-Install_MartinLoop-007ACC?logo=visualstudiocode&logoColor=white)](vscode:mcp/install?%7B%22name%22%3A%22martin-loop%22%2C%22command%22%3A%22npx%22%2C%22args%22%3A%5B%22-y%22%2C%22%40martinloop%2Fmcp%400.5.6%22%5D%7D)
          -[![Add to Cursor](https://img.shields.io/badge/Cursor-Add_MartinLoop-111111)](cursor://anysphere.cursor-deeplink/mcp/install?name=martin-loop&config=eyJjb21tYW5kIjoibnB4IiwiYXJncyI6WyIteSIsIkBtYXJ0aW5sb29wL21jcEAwLjUuNiJdfQ%3D%3D)
          +[![Install in VS Code](https://img.shields.io/badge/VS_Code-Install_MartinLoop-007ACC?logo=visualstudiocode&logoColor=white)](vscode:mcp/install?%7B%22name%22%3A%22martin-loop%22%2C%22command%22%3A%22npx%22%2C%22args%22%3A%5B%22-y%22%2C%22%40martinloop%2Fmcp%400.6.0%22%5D%7D)
          +[![Add to Cursor](https://img.shields.io/badge/Cursor-Add_MartinLoop-111111)](cursor://anysphere.cursor-deeplink/mcp/install?name=martin-loop&config=eyJjb21tYW5kIjoibnB4IiwiYXJncyI6WyIteSIsIkBtYXJ0aW5sb29wL21jcEAwLjYuMCJdfQ%3D%3D)
          @@ -408,7 +405,7 @@
          -The root `martin-loop` package, standalone `@martinloop/mcp` package, plugin metadata, and MCPB product version are aligned at `0.5.7`. The MCPB manifest schema remains `0.3`.
          +The root `martin-loop` package, standalone `@martinloop/mcp` package, plugin metadata, and MCPB product version are aligned at `0.6.0`. The MCPB manifest schema remains `0.3`.
          PATCH
          git apply --3way --recount /tmp/readme.patch

          cat > /tmp/rootguard.patch <<'PATCH'
          diff --git a/scripts/root-release-guard.mjs b/scripts/root-release-guard.mjs
          --- a/scripts/root-release-guard.mjs
          +++ b/scripts/root-release-guard.mjs
          @@ -13,6 +13,7 @@ const ALLOWED_FILES = [
             "CODE_OF_CONDUCT.md",
             "README.md",
             "demo/seeded-workspace",
          +  "examples/github-actions-budget-gate",
             "dist",
           ];
          @@ -28,6 +29,8 @@ const ALLOWED_PACKED_PREFIXES = [
             "README.md",
             "demo/README.md",
             "demo/seeded-workspace/",
          +  "examples/README.md",
          +  "examples/github-actions-budget-gate/",
             "dist/",
             "package.json",
           ];
          @@ -83,7 +86,11 @@ export function assertRootVersionPolicy(version) {
           export function assertPackedSurface(packedFiles) {
             const uniqueFiles = [...new Set(packedFiles)].sort();
           
          -  for (const requiredFile of ["package.json", ...REQUIRED_DIST_FILES]) {
          +  for (const requiredFile of [
          +    "package.json",
          +    ...REQUIRED_DIST_FILES,
          +    "examples/github-actions-budget-gate/.github/workflows/martinloop-budget-gate.yml",
          +  ]) {
               if (!uniqueFiles.includes(requiredFile)) {
                 throw new Error(`Packed tarball is missing required file ${requiredFile}.`);
               }
          PATCH
          git apply --3way --recount /tmp/rootguard.patch

          cat > /tmp/mcpdocs.patch <<'PATCH'
          diff --git a/scripts/tests/mcp-release-docs.test.mjs b/scripts/tests/mcp-release-docs.test.mjs
          --- a/scripts/tests/mcp-release-docs.test.mjs
          +++ b/scripts/tests/mcp-release-docs.test.mjs
          @@ -29,14 +29,14 @@ test("current MCP metadata stays aligned for the release cut", async () => {
           test("version ledger separates live public truth from the pending release target", async () => {
             const ledger = await readRepoFile(path.join("docs", "release", "VERSION-LEDGER.md"));
           
          -  assert.match(ledger, new RegExp(escapeRegex("live npm dist-tag `latest`: `0.5.5`")));
          -  assert.match(ledger, new RegExp(escapeRegex("live public GitHub release: `v0.5.5`")));
          -  assert.match(ledger, new RegExp(escapeRegex("live public GitHub release: `mcp-v0.5.5`")));
          +  assert.match(ledger, new RegExp(escapeRegex("live npm dist-tag `latest`: `0.5.8`")));
          +  assert.match(ledger, new RegExp(escapeRegex("live public GitHub release: `v0.5.8`")));
          +  assert.match(ledger, new RegExp(escapeRegex("live public GitHub release: `mcp-v0.5.8`")));
             assert.match(ledger, /root public baseline: `\d+\.\d+\.\d+`/);
             assert.match(ledger, /live public GitHub release: `v\d+\.\d+\.\d+`/);
             assert.match(
               ledger,
          -    new RegExp(escapeRegex("standalone MCP public baseline: `0.5.5`")),
          +    new RegExp(escapeRegex("standalone MCP public baseline: `0.5.8`")),
             );
          PATCH
          git apply --3way --recount /tmp/mcpdocs.patch

          cat > /tmp/rootguardtest.patch <<'PATCH'
          diff --git a/scripts/tests/root-release-guard.test.mjs b/scripts/tests/root-release-guard.test.mjs
          --- a/scripts/tests/root-release-guard.test.mjs
          +++ b/scripts/tests/root-release-guard.test.mjs
          @@ -16,6 +16,10 @@ const ROOT_DIR = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "../
           test("runRootReleaseGuard accepts the current OSS-safe root package shape", async () => {
             const manifest = JSON.parse(await readFile(path.join(ROOT_DIR, "package.json"), "utf8"));
          +  assert.ok(
          +    manifest.files.includes("examples/github-actions-budget-gate"),
          +    "the documented GitHub Actions budget-gate example must ship in the root package",
          +  );
             const expectedTag = `v${manifest.version}`;
          @@ -46,6 +50,7 @@ test("assertPackedSurface rejects unexpected non-OSS paths", () => {
                   "dist/index.js",
                   "dist/index.d.ts",
                   "dist/bin/martin-loop.js",
          +        "examples/github-actions-budget-gate/.github/workflows/martinloop-budget-gate.yml",
                   "server/secrets.json",
                 ]),
          @@ -62,6 +67,7 @@ test("assertPackedSurface rejects forbidden vendored implementation paths", () => {
                   "dist/index.js",
                   "dist/index.d.ts",
                   "dist/bin/martin-loop.js",
          +        "examples/github-actions-budget-gate/.github/workflows/martinloop-budget-gate.yml",
                   "dist/vendor/cli/bin/martin.js",
                 ]),
          PATCH
          git apply --3way --recount /tmp/rootguardtest.patch

          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text()
          marker = '## [Unreleased]\n'
          entry = '''## [0.6.0] - 2026-09-06\n\n### Fixed\n- Preserved successful verifier evidence in Verified Handoffs even when a budget boundary determines the final run outcome.\n- Refreshed stale canonical MCP host configuration while preserving unrelated settings.\n- Rejected empty governed-run objectives before engine discovery or agent spend.\n- Made `martin-loop demo` create a ready-to-run Git workspace automatically.\n\n### Changed\n- Added a non-blocking upgrade notice for outdated installs; execution continues and JSON stdout remains machine-readable.\n- Included the runnable GitHub Actions budget-gate workflow in the published package.\n\n'''
          if '## [0.6.0]' not in s:
              s = s.replace(marker, marker + '\n' + entry, 1)
              p.write_text(s)
          PY

          git diff --check
          git rm .github/workflows/finalize-0.6.0-release-surface.yml
          git add README.md CHANGELOG.md scripts/root-release-guard.mjs scripts/tests/mcp-release-docs.test.mjs scripts/tests/root-release-guard.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): finalize MartinLoop 0.6.0 public surface [release-surface-applied]"
          git push origin HEAD:public-staging/0.6.0-20260906
