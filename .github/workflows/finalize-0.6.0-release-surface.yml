name: Finalize 0.6.0 Release Surface

on:
  push:
    branches:
      - public-staging/0.6.0-20260906

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[apply-release-surface]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: public-staging/0.6.0-20260906
          fetch-depth: 0
      - name: Finalize reviewed public release surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"required pattern missing in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new))

          # README: update only release/install/version truth, preserving newer public-only copy.
          replace_required('README.md',
              'Release notes for the current root package: [MartinLoop 0.5.8](./docs/release/OSS-0.5.8-RELEASE-NOTES.md).',
              'Release notes for MartinLoop 0.6.0: [MartinLoop 0.6.0](./docs/release/OSS-0.6.0-RELEASE-NOTES.md).')
          replace_required('README.md', 'martin-loop@0.5.6', 'martin-loop@0.6.0')
          replace_required('README.md', 'pin the package line (`martin-loop@0.5.8`)', 'pin the package line (`martin-loop@0.6.0`)')
          replace_required('README.md', '<!-- MCP package: @martinloop/mcp@0.5.8 -->', '<!-- MCP package: @martinloop/mcp@0.6.0 -->')
          replace_required('README.md',
              '[![Install in VS Code](https://img.shields.io/badge/VS_Code-Install_MartinLoop-007ACC?logo=visualstudiocode&logoColor=white)](vscode:mcp/install?%7B%22name%22%3A%22martin-loop%22%2C%22command%22%3A%22npx%22%2C%22args%22%3A%5B%22-y%22%2C%22%40martinloop%2Fmcp%400.5.8%22%5D%7D)',
              '[![Install in VS Code](https://img.shields.io/badge/VS_Code-Install_MartinLoop-007ACC?logo=visualstudiocode&logoColor=white)](vscode:mcp/install?%7B%22name%22%3A%22martin-loop%22%2C%22command%22%3A%22npx%22%2C%22args%22%3A%5B%22-y%22%2C%22%40martinloop%2Fmcp%400.6.0%22%5D%7D)')
          replace_required('README.md',
              '[![Add to Cursor](https://img.shields.io/badge/Cursor-Add_MartinLoop-111111)](cursor://anysphere.cursor-deeplink/mcp/install?name=martin-loop&config=eyJjb21tYW5kIjoibnB4IiwiYXJncyI6WyIteSIsIkBtYXJ0aW5sb29wL21jcEAwLjUuOCJdfQ%3D%3D)',
              '[![Add to Cursor](https://img.shields.io/badge/Cursor-Add_MartinLoop-111111)](cursor://anysphere.cursor-deeplink/mcp/install?name=martin-loop&config=eyJjb21tYW5kIjoibnB4IiwiYXJncyI6WyIteSIsIkBtYXJ0aW5sb29wL21jcEAwLjYuMCJdfQ%3D%3D)')
          replace_required('README.md',
              'The root `martin-loop` package, standalone `@martinloop/mcp` package, plugin metadata, and MCPB product version are aligned at `0.5.8`.',
              'The root `martin-loop` package, standalone `@martinloop/mcp` package, plugin metadata, and MCPB product version are aligned at `0.6.0`.')

          # Release guard: package the documented GitHub Actions example and require it in tarballs.
          replace_required('scripts/root-release-guard.mjs',
              '  "demo/seeded-workspace",\n  "dist",',
              '  "demo/seeded-workspace",\n  "examples/github-actions-budget-gate",\n  "dist",')
          replace_required('scripts/root-release-guard.mjs',
              '  "demo/seeded-workspace/",\n  "dist/",',
              '  "demo/seeded-workspace/",\n  "examples/README.md",\n  "examples/github-actions-budget-gate/",\n  "dist/",')
          replace_required('scripts/root-release-guard.mjs',
              '  for (const requiredFile of ["package.json", ...REQUIRED_DIST_FILES]) {',
              '  for (const requiredFile of [\n    "package.json",\n    ...REQUIRED_DIST_FILES,\n    "examples/github-actions-budget-gate/.github/workflows/martinloop-budget-gate.yml",\n  ]) {')

          # Release-doc tests must describe the actual 0.5.8 live baseline while 0.6.0 is pending.
          for old, new in [
              ('live npm dist-tag `latest`: `0.5.5`', 'live npm dist-tag `latest`: `0.5.8`'),
              ('live public GitHub release: `v0.5.5`', 'live public GitHub release: `v0.5.8`'),
              ('live public GitHub release: `mcp-v0.5.5`', 'live public GitHub release: `mcp-v0.5.8`'),
              ('standalone MCP public baseline: `0.5.5`', 'standalone MCP public baseline: `0.5.8`'),
          ]:
              replace_required('scripts/tests/mcp-release-docs.test.mjs', old, new)

          # Root release guard regression inputs now include the required workflow.
          replace_required('scripts/tests/root-release-guard.test.mjs',
              '  const manifest = JSON.parse(await readFile(path.join(ROOT_DIR, "package.json"), "utf8"));\n  const expectedTag',
              '  const manifest = JSON.parse(await readFile(path.join(ROOT_DIR, "package.json"), "utf8"));\n  assert.ok(\n    manifest.files.includes("examples/github-actions-budget-gate"),\n    "the documented GitHub Actions budget-gate example must ship in the root package",\n  );\n  const expectedTag')
          testp = Path('scripts/tests/root-release-guard.test.mjs')
          ts = testp.read_text()
          needle = '        "dist/bin/martin-loop.js",\n'
          if ts.count(needle) < 2:
              raise SystemExit('expected root release test fixtures not found')
          ts = ts.replace(needle, needle + '        "examples/github-actions-budget-gate/.github/workflows/martinloop-budget-gate.yml",\n', 2)
          testp.write_text(ts)

          # Current MCP-config tests need the 0.6.0 refresh semantics.
          p = Path('packages/cli/tests/mcp-config.test.ts')
          s = p.read_text()
          replacements = [
            ('it("treats existing Codex configs with old or new Martin sections as idempotent", async () => {', 'it("replaces a stale Codex Martin section while preserving unrelated TOML", async () => {'),
            ('        \'[mcp_servers.martin_loop]\',\n        \'command = "npx"\',\n        \'args = ["-y", "@martinloop/mcp"]\',', '        "[features]",\n        "shell_snapshot = true",\n        "",\n        \'[mcp_servers.martin_loop]\',\n        \'command = "npx"\',\n        \'args = ["-y", "@keean12/mcp"]\','),
            ('      expect(await readFile(configPath, "utf8")).toBe(existing);', '      const installed = await readFile(configPath, "utf8");\n      expect(installed).toContain("[features]");\n      expect(installed).toContain("shell_snapshot = true");\n      expect(installed).toContain(\'[mcp_servers."martin-loop"]\');\n      expect(installed).toContain(\'"@martinloop/mcp"\');\n      expect(installed).not.toContain("@keean12/mcp");\n      expect(installed).not.toContain("[mcp_servers.martin_loop]");'),
            ('it("treats existing Claude configs with a martin-loop block as idempotent", async () => {', 'it("refreshes an existing Claude martin-loop block to the canonical package", async () => {'),
            ('              args: ["-y", "@martinloop/mcp"]', '              args: ["-y", "@keean12/mcp"]'),
            ('it("treats existing Gemini configs with a martin-loop block as idempotent", async () => {', 'it("refreshes an existing Gemini martin-loop block", async () => {'),
            ('it("treats existing native VS Code configs with martin-loop as idempotent", async () => {', 'it("refreshes an existing native VS Code martin-loop config", async () => {'),
            ('it("treats existing Continue array configs with martin-loop as idempotent", async () => {', 'it("refreshes an existing Continue array martin-loop config", async () => {'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'mcp-config test pattern missing: {old[:100]}')
              s = s.replace(old, new, 1)
          # Replace the five old idempotent equality assertions with refresh assertions using scoped nearby text.
          s = s.replace('      expect(await readFile(configPath, "utf8")).toBe(`${existing}\\n`);', '      const installed = JSON.parse(await readFile(configPath, "utf8"));\n      expect(installed.mcpServers["martin-loop"].args).toContain("@martinloop/mcp");\n      expect(JSON.stringify(installed)).not.toContain("@keean12/mcp");', 1)
          s = s.replace('      expect(await readFile(configPath, "utf8")).toBe(`${existing}\\n`);', '      const installed = JSON.parse(await readFile(configPath, "utf8"));\n      expect(installed.mcpServers["martin-loop"].args).toContain("@martinloop/mcp");\n      expect(installed.mcpServers["martin-loop"].includeTools).toContain("martin_doctor");', 1)
          s = s.replace('      expect(await readFile(configPath, "utf8")).toBe(`${existing}\\n`);', '      const installed = JSON.parse(await readFile(configPath, "utf8"));\n      expect(installed.servers["martin-loop"].args).toContain("@martinloop/mcp");\n      expect(installed.servers["martin-loop"].env.MARTIN_RUNS_DIR).toBe(join(cwd, ".runs"));', 1)
          s = s.replace('      expect(await readFile(configPath, "utf8")).toBe(`${existing}\\n`);', '      const installed = JSON.parse(await readFile(configPath, "utf8"));\n      expect(installed.mcpServers).toHaveLength(1);\n      expect(installed.mcpServers[0].args).toContain("@martinloop/mcp");\n      expect(installed.mcpServers[0].includeTools).toContain("martin_doctor");', 1)
          p.write_text(s)

          # Changelog entry required by the trusted cut-release workflow.
          p = Path('CHANGELOG.md')
          s = p.read_text()
          marker = '## [Unreleased]\n'
          entry = '''## [0.6.0] - 2026-09-06\n\n### Fixed\n- Preserved successful verifier evidence in Verified Handoffs even when a budget boundary determines the final run outcome.\n- Refreshed stale canonical MCP host configuration while preserving unrelated settings.\n- Rejected empty governed-run objectives before engine discovery or agent spend.\n- Made `martin-loop demo` create a ready-to-run Git workspace automatically.\n\n### Changed\n- Added a non-blocking upgrade notice for outdated installs; execution continues and JSON stdout remains machine-readable.\n- Included the runnable GitHub Actions budget-gate workflow in the published package.\n\n'''
          if '## [0.6.0]' not in s:
              if marker not in s:
                  raise SystemExit('CHANGELOG Unreleased marker missing')
              p.write_text(s.replace(marker, marker + '\n' + entry, 1))
          PY

          git diff --check
          git rm .github/workflows/finalize-0.6.0-release-surface.yml
          git add README.md CHANGELOG.md packages/cli/tests/mcp-config.test.ts scripts/root-release-guard.mjs scripts/tests/mcp-release-docs.test.mjs scripts/tests/root-release-guard.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): finalize MartinLoop 0.6.0 public surface [release-surface-applied]"
          git push origin HEAD:public-staging/0.6.0-20260906
