name: Apply approved hero and program panel

on:
  push:
    paths:
      - .github/workflows/apply-hero-programs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README without touching other sections
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          old_hero = """  **MartinLoop gives AI coding agents budgets, stop conditions, rollback rules, and receipts.**

  Built from thousands of agent runs where the problem was not intelligence -- it was uncontrolled execution.

  **Get started:** `npx -y martin-loop@latest start`  
  **Try the demo:** `npx -y martin-loop@latest demo`
"""

          new_hero = """  **Autonomous AI needs an independent control layer.**

  **MartinLoop makes every agent action bounded, verified, reversible, priced, and provable.**

  Starting with software work across Claude, Codex, Gemini, Cursor, and internal agent systems.

  Built from thousands of agent runs where the problem was not intelligence -- it was uncontrolled execution.

  **Get started:** `npx -y martin-loop@latest start`  
  **Try the demo:** `npx -y martin-loop@latest demo`  
  **Connect the MCP:** `npx -y @martinloop/mcp`
"""

          old_program = """  MartinLoop is part of the NVIDIA Inception program.
  <br>
  <picture>
    <source media="(prefers-color-scheme: dark)" srcset="./docs/assets/nvidia-inception-program.png">
    <img src="./docs/assets/nvidia-inception-program-light.png" alt="NVIDIA Inception Program logo" width="280">
  </picture>
"""

          new_program = """  <br>
  <a href="https://martinloop.com/" aria-label="MartinLoop program memberships">
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="https://martinloop.com/programs/martinloop-program-memberships-dark.svg">
      <img src="https://martinloop.com/programs/martinloop-program-memberships-light.svg" alt="MartinLoop is a member of NVIDIA Inception, Microsoft for Startups, AWS Activate, and Google for Startups" width="760">
    </picture>
  </a>
"""

          if text.count(old_hero) != 1:
              raise SystemExit(f"expected exactly one hero block; found {text.count(old_hero)}")
          if text.count(old_program) != 1:
              raise SystemExit(f"expected exactly one top program block; found {text.count(old_program)}")

          text = text.replace(old_hero, new_hero, 1)
          text = text.replace(old_program, new_program, 1)
          path.write_text(text, encoding="utf-8")

      - name: Validate approved scope
        shell: python
        run: |
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          required = [
              "Autonomous AI needs an independent control layer.",
              "MartinLoop makes every agent action bounded, verified, reversible, priced, and provable.",
              "Starting with software work across Claude, Codex, Gemini, Cursor, and internal agent systems.",
              "martinloop-program-memberships-light.svg",
              "martinloop-program-memberships-dark.svg",
              "<strong>Star this repo</strong>",
              "./docs/assets/nvidia-inception-program-light.png",
              "./docs/assets/nvidia-inception-program.png",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"missing required README content: {missing}")

      - name: Commit README and remove temporary workflow
        run: |
          rm .github/workflows/apply-hero-programs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/apply-hero-programs.yml
          git commit -m "docs: adopt independent control layer vision"
          git push

      - name: Remove temporary test branches
        run: |
          for branch in \
            tmp/program-assets-copy-test \
            tmp/program-assets-copy-test-2 \
            tmp/program-assets-copy-test-3 \
            tmp/program-assets-copy-test-4 \
            tmp/program-assets-copy-test-5 \
            tmp/program-assets-copy-test-6 \
            tmp/program-assets-copy-test-7 \
            tmp/program-assets-copy-test-8; do
            git push origin --delete "$branch" || true
          done
