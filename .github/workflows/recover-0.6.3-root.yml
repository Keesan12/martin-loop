name: Recover 0.6.3 root publish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-0.6.3-root.yml
      - .github/workflows/release.yml

permissions:
  contents: write
  id-token: write

jobs:
  publish-root:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v0.6.3
      validated_release_sha: 790d0ae9dacafefe70f6b9c116c3937eb4d0d13b
      recovery_state: RETRY_PUBLISH_SAME_VALIDATED_TAG
    secrets: inherit
