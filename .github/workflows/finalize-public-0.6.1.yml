name: Finalize public 0.6.1

on:
  push:
    branches:
      - public-staging/0.6.1-model-agnostic

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-public-061]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: public-staging/0.6.1-model-agnostic
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare exact public release metadata
        env:
          PRIVATE_MAIN_SHA: 40b555f44027bb62c56f2aa6ce54047bcc423c5b
          PUBLIC_BASE_SHA: 5e1e2f2494cae02a850cbf6162cf738863edc5e0
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/prepare-public-0.6.1.mjs')
          s = p.read_text()
          s = s.replace('\\\\`', '\\`')
          p.write_text(s)
          PY
          export VALIDATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/prepare-public-0.6.1.mjs
      - name: Build
        run: pnpm build
      - name: Release authority
        run: pnpm release:authority:check && pnpm release:authority:check:built
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Public boundary guards
        run: pnpm public:copy-scan && pnpm public:git-surface && pnpm oss:validate && pnpm public:smoke
      - name: Release matrix
        run: pnpm release:matrix:local
      - name: MCP release validation
        run: pnpm --filter @martinloop/mcp version:check && pnpm mcp:pack:smoke && pnpm mcp:published:smoke:pack && pnpm --filter @martinloop/mcp verify:release
      - name: Root package release guard
        run: node scripts/root-release-guard.mjs --tag v0.6.1 --pack
      - name: Remove temporary preparation machinery and commit validated public candidate
        shell: bash
        run: |
          rm -f .github/workflows/finalize-public-0.6.1.yml
          rm -f .github/workflows/check-public-prep-script.yml
          rm -f scripts/prepare-public-0.6.1.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: stage MartinLoop 0.6.1 public candidate"
          git push origin HEAD:public-staging/0.6.1-model-agnostic
