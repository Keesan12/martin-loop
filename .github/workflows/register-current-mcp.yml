name: register-current-mcp

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/register-current-mcp.yml'

permissions:
  contents: read
  id-token: write

jobs:
  register-current-mcp:
    name: Register current @martinloop/mcp release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate MCP metadata parity
        id: mcp-metadata
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('packages/mcp/package.json', 'utf8'));
          const server = JSON.parse(fs.readFileSync('packages/mcp/server.json', 'utf8'));
          const npmPackage = server.packages?.find((entry) => entry.registryType === 'npm');

          if (!npmPackage) throw new Error('server.json is missing its npm package entry.');
          if (pkg.name !== npmPackage.identifier) throw new Error('npm package identifier mismatch.');
          if (pkg.version !== server.version || pkg.version !== npmPackage.version) {
            throw new Error('package.json and server.json versions are not aligned.');
          }
          if (pkg.mcpName !== server.name) throw new Error('mcpName does not match server.json name.');
          if (server.description.length > 100) throw new Error('Registry descriptions must be 100 characters or fewer.');

          console.log(`package_name=${pkg.name}`);
          console.log(`version=${pkg.version}`);
          console.log(`server_name=${server.name}`);
          NODE

      - name: Verify npm artifact exists
        shell: bash
        run: npm view "${{ steps.mcp-metadata.outputs.package_name }}@${{ steps.mcp-metadata.outputs.version }}" version

      - name: Check official MCP Registry
        id: registry-state
        shell: bash
        env:
          SERVER_NAME: ${{ steps.mcp-metadata.outputs.server_name }}
          SERVER_VERSION: ${{ steps.mcp-metadata.outputs.version }}
        run: |
          ENCODED_NAME="${SERVER_NAME//\//%2F}"
          REGISTRY_URL="https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_NAME}/versions/${SERVER_VERSION}"
          HTTP_CODE=$(curl --silent --show-error --output /tmp/mcp-registry-response.json --write-out '%{http_code}' "$REGISTRY_URL")

          case "$HTTP_CODE" in
            200)
              echo "publish_needed=false" >> "$GITHUB_OUTPUT"
              echo "${SERVER_NAME}@${SERVER_VERSION} is already registered."
              ;;
            404)
              echo "publish_needed=true" >> "$GITHUB_OUTPUT"
              echo "${SERVER_NAME}@${SERVER_VERSION} is not registered yet."
              ;;
            *)
              cat /tmp/mcp-registry-response.json || true
              echo "Unexpected MCP Registry response: HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac

      - name: Install mcp-publisher
        if: steps.registry-state.outputs.publish_needed == 'true'
        working-directory: packages/mcp
        shell: bash
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate to official MCP Registry
        if: steps.registry-state.outputs.publish_needed == 'true'
        working-directory: packages/mcp
        run: ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        if: steps.registry-state.outputs.publish_needed == 'true'
        working-directory: packages/mcp
        run: ./mcp-publisher publish

      - name: Verify official MCP Registry listing
        shell: bash
        env:
          SERVER_NAME: ${{ steps.mcp-metadata.outputs.server_name }}
          SERVER_VERSION: ${{ steps.mcp-metadata.outputs.version }}
        run: |
          ENCODED_NAME="${SERVER_NAME//\//%2F}"
          curl --fail --show-error --silent \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_NAME}/versions/${SERVER_VERSION}" \
            > /tmp/mcp-registry-verified.json
          cat /tmp/mcp-registry-verified.json
