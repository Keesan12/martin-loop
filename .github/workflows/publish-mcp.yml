name: publish-mcp

on:
  workflow_run:
    workflows:
      - "Validate and cut paired release tags"
    types:
      - completed

permissions:
  contents: write
  id-token: write

jobs:
  publish-mcp:
    name: Publish @martinloop/mcp
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.repository == 'Keesan12/martin-loop'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release coordinates
        id: release-vars
        shell: bash
        env:
          VALIDATED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION="$(node -p "require('./packages/mcp/package.json').version")"
          RELEASE_TAG="mcp-v${VERSION}"
          test "$(git rev-parse HEAD)" = "$VALIDATED_RELEASE_SHA"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify paired tags resolve to current public main
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-vars.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#mcp-v}"
          git fetch origin main
          git fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          ROOT_TAG_SHA="$(git rev-list -n 1 "v${VERSION}")"
          MAIN_SHA="$(git rev-parse origin/main)"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$TAG_SHA"
          test "$TAG_SHA" = "$ROOT_TAG_SHA"
          test "$TAG_SHA" = "$MAIN_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard public git surface
        run: |
          pnpm release:clean-check
          pnpm release:authority:check
          pnpm --filter @martinloop/mcp version:check
          pnpm public:git-surface
          pnpm public:portability-guard

      - name: Build workspace packages needed by MCP validation
        run: pnpm build

      - name: Verify MCP package
        run: |
          pnpm --filter @martinloop/mcp lint
          pnpm --filter @martinloop/mcp test
          pnpm --filter @martinloop/mcp build
          pnpm --filter @martinloop/mcp smoke:pack
          pnpm --filter @martinloop/mcp smoke:published:pack
          pnpm --filter @martinloop/mcp verify:release
          pnpm release:authority:check:built
          pnpm release:clean-check

      - name: Read MCP package metadata
        id: mcp-metadata
        working-directory: packages/mcp
        shell: bash
        run: |
          node ../../scripts/read-mcp-package-metadata.mjs >> "$GITHUB_OUTPUT"

      - name: Build, validate, and smoke MCPB
        run: |
          pnpm --filter @martinloop/mcp mcpb:build
          pnpm --filter @martinloop/mcp mcpb:validate
          pnpm --filter @martinloop/mcp mcpb:smoke

      - name: Verify MCPB release assets
        shell: bash
        env:
          MCPB_PATH: packages/mcp/dist-mcpb/martinloop-${{ steps.mcp-metadata.outputs.package_version }}.mcpb
          CHECKSUM_PATH: packages/mcp/dist-mcpb/martinloop-${{ steps.mcp-metadata.outputs.package_version }}.mcpb.sha256
        run: |
          test -f "${MCPB_PATH}"
          test -f "${CHECKSUM_PATH}"
          (
            cd "$(dirname "${MCPB_PATH}")"
            sha256sum --check "$(basename "${CHECKSUM_PATH}")"
          )

      - name: Verify MCP tag/version parity
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-vars.outputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#mcp-v}"
          if [ "$TAG_VERSION" = "$RELEASE_TAG" ]; then
            echo "Expected an mcp-vX.Y.Z tag but received ${RELEASE_TAG}."
            exit 1
          fi

          if [ "$TAG_VERSION" != "${{ steps.mcp-metadata.outputs.package_version }}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${{ steps.mcp-metadata.outputs.package_version }}."
            exit 1
          fi

          if [ "$TAG_VERSION" != "${{ steps.mcp-metadata.outputs.server_version }}" ]; then
            echo "Tag ${RELEASE_TAG} does not match server.json version ${{ steps.mcp-metadata.outputs.server_version }}."
            exit 1
          fi

      - name: Check npm for existing MCP version
        id: npm-version
        shell: bash
        run: |
          if npm view "@martinloop/mcp@${{ steps.mcp-metadata.outputs.package_version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize npm provenance repository metadata
        if: steps.npm-version.outputs.exists != 'true'
        working-directory: packages/mcp
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.repository = {
            type: 'git',
            url: 'https://github.com/Keesan12/martin-loop',
            directory: 'packages/mcp'
          };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Publish MCP to npm
        if: steps.npm-version.outputs.exists != 'true'
        working-directory: packages/mcp
        run: npm publish --access public --provenance

      - name: Skip duplicate MCP publish
        if: steps.npm-version.outputs.exists == 'true'
        run: echo "@martinloop/mcp@${{ steps.mcp-metadata.outputs.package_version }} already exists on npm; skipping publish."

      - name: Verify published MCP artifact
        env:
          MARTIN_MCP_PACKAGE_SPEC: "@martinloop/mcp@${{ steps.mcp-metadata.outputs.package_version }}"
          MCP_PACKAGE_SPEC: "@martinloop/mcp@${{ steps.mcp-metadata.outputs.package_version }}"
        run: |
          for attempt in 1 2 3 4 5; do
            if npm view "${MCP_PACKAGE_SPEC}" version; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "npm view did not observe ${MCP_PACKAGE_SPEC} after bounded retries."
              exit 1
            fi

            sleep $((attempt * 15))
          done

          for attempt in 1 2 3; do
            if pnpm --filter @martinloop/mcp smoke:published; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Published MCP smoke failed after bounded retries."
              exit 1
            fi

            sleep $((attempt * 20))
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ steps.release-vars.outputs.tag }}
          name: "@martinloop/mcp ${{ steps.mcp-metadata.outputs.package_version }}"
          body_path: "docs/release/MCP-${{ steps.mcp-metadata.outputs.package_version }}-RELEASE-NOTES.md"
          files: |
            packages/mcp/dist-mcpb/martinloop-${{ steps.mcp-metadata.outputs.package_version }}.mcpb
            packages/mcp/dist-mcpb/martinloop-${{ steps.mcp-metadata.outputs.package_version }}.mcpb.sha256
          fail_on_unmatched_files: true
