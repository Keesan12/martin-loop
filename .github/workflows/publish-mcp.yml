name: publish-mcp

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing mcp-vX.Y.Z tag to publish
        required: true
        type: string
  push:
    tags:
      - 'mcp-v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish-mcp:
    name: Publish @martinloop/mcp
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release coordinates
        id: release-vars
        shell: bash
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          RELEASE_TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Missing release tag."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != mcp-v* ]]; then
            echo "Expected an mcp-vX.Y.Z tag"
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#mcp-v}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-vars.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard public git surface
        run: |
          pnpm public:git-surface
          pnpm public:portability-guard

      - name: Verify MCP package
        run: |
          pnpm --filter @martinloop/mcp lint
          pnpm --filter @martinloop/mcp test
          pnpm --filter @martinloop/mcp build
          pnpm --filter @martinloop/mcp smoke:pack
          pnpm --filter @martinloop/mcp smoke:published:pack
          pnpm --filter @martinloop/mcp verify:release

      - name: Read MCP package metadata
        id: mcp-metadata
        working-directory: packages/mcp
        shell: bash
        run: |
          node ../../scripts/read-mcp-package-metadata.mjs >> "$GITHUB_OUTPUT"

      - name: Build and validate MCPB
        run: |
          pnpm --filter @martinloop/mcp mcpb:build
          pnpm --filter @martinloop/mcp mcpb:validate

      - name: Verify MCPB release assets
        shell: bash
        env:
          MCPB_PATH: packages/mcp/dist-mcpb/martinloop-${{ steps.mcp-metadata.outputs.package_version }}.mcpb
          CHECKSUM_PATH: packages/mcp/dist-mcpb/martinloop-${{ steps.mcp-metadata.outputs.package_version }}.mcpb.sha256
        run: |
          test -f "${MCPB_PATH}"
          test -f "${CHECKSUM_PATH}"
          (
            cd "$(dirname "${MCPB_PATH}")"
            sha256sum --check "$(basename "${CHECKSUM_PATH}")"
          )

      - name: Verify MCP tag/version parity
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-vars.outputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#mcp-v}"
          if [ "$TAG_VERSION" = "$RELEASE_TAG" ]; then
            echo "Expected an mcp-vX.Y.Z tag but received ${RELEASE_TAG}."
            exit 1
          fi

          if [ "$TAG_VERSION" != "${{ steps.mcp-metadata.outputs.package_version }}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${{ steps.mcp-metadata.outputs.package_version }}."
            exit 1
          fi

          if [ "$TAG_VERSION" != "${{ steps.mcp-metadata.outputs.server_version }}" ]; then
            echo "Tag ${RELEASE_TAG} does not match server.json version ${{ steps.mcp-metadata.outputs.server_version }}."
            exit 1
          fi

      - name: Check npm for existing MCP version
        id: npm-version
        shell: bash
        run: |
          if npm view "@martinloop/mcp@${{ steps.mcp-metadata.outputs.package_version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish MCP to npm
        if: steps.npm-version.outputs.exists != 'true'
        working-directory: packages/mcp
        run: npm publish --access public --provenance

      - name: Skip duplicate MCP publish
        if: steps.npm-version.outputs.exists == 'true'
        run: echo "@martinloop/mcp@${{ steps.mcp-metadata.outputs.package_version }} already exists on npm; skipping publish."

      - name: Verify published MCP artifact
        env:
          MARTIN_MCP_PACKAGE_SPEC: "@martinloop/mcp@${{ steps.mcp-metadata.outputs.package_version }}"
          MCP_PACKAGE_SPEC: "@martinloop/mcp@${{ steps.mcp-metadata.outputs.package_version }}"
        run: |
          for attempt in 1 2 3 4 5; do
            if npm view "${MCP_PACKAGE_SPEC}" version; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "npm view did not observe ${MCP_PACKAGE_SPEC} after bounded retries."
              exit 1
            fi

            sleep $((attempt * 15))
          done

          for attempt in 1 2 3; do
            if pnpm --filter @martinloop/mcp smoke:published; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Published MCP smoke failed after bounded retries."
              exit 1
            fi

            sleep $((attempt * 20))
          done

      - name: Check official MCP Registry
        id: registry-state
        shell: bash
        env:
          SERVER_NAME: ${{ steps.mcp-metadata.outputs.server_name }}
          SERVER_VERSION: ${{ steps.mcp-metadata.outputs.server_version }}
        run: |
          ENCODED_NAME="${SERVER_NAME//\//%2F}"
          REGISTRY_URL="https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_NAME}/versions/${SERVER_VERSION}"
          HTTP_CODE=$(curl --silent --show-error --output /tmp/mcp-registry-response.json --write-out '%{http_code}' "$REGISTRY_URL")

          case "$HTTP_CODE" in
            200)
              echo "publish_needed=false" >> "$GITHUB_OUTPUT"
              echo "${SERVER_NAME}@${SERVER_VERSION} is already registered."
              ;;
            404)
              echo "publish_needed=true" >> "$GITHUB_OUTPUT"
              echo "${SERVER_NAME}@${SERVER_VERSION} is not registered yet."
              ;;
            *)
              cat /tmp/mcp-registry-response.json || true
              echo "Unexpected MCP Registry response: HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac

      - name: Install mcp-publisher
        if: steps.registry-state.outputs.publish_needed == 'true'
        working-directory: packages/mcp
        shell: bash
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate to official MCP Registry
        if: steps.registry-state.outputs.publish_needed == 'true'
        working-directory: packages/mcp
        run: ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        if: steps.registry-state.outputs.publish_needed == 'true'
        working-directory: packages/mcp
        run: ./mcp-publisher publish

      - name: Verify official MCP Registry listing
        shell: bash
        env:
          SERVER_NAME: ${{ steps.mcp-metadata.outputs.server_name }}
          SERVER_VERSION: ${{ steps.mcp-metadata.outputs.server_version }}
        run: |
          ENCODED_NAME="${SERVER_NAME//\//%2F}"
          curl --fail --show-error --silent \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_NAME}/versions/${SERVER_VERSION}" \
            > /tmp/mcp-registry-verified.json
          cat /tmp/mcp-registry-verified.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ steps.release-vars.outputs.tag }}
          name: "@martinloop/mcp ${{ steps.mcp-metadata.outputs.package_version }}"
          body_path: "docs/release/MCP-${{ steps.mcp-metadata.outputs.package_version }}-RELEASE-NOTES.md"
          files: |
            packages/mcp/dist-mcpb/martinloop-${{ steps.mcp-metadata.outputs.package_version }}.mcpb
            packages/mcp/dist-mcpb/martinloop-${{ steps.mcp-metadata.outputs.package_version }}.mcpb.sha256
          fail_on_unmatched_files: true
