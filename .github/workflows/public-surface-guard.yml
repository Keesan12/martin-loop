name: Public Surface Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - public-staging/**

permissions:
  contents: read

jobs:
  public-surface-guard:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'public-staging/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run public copy and portability guards
        run: |
          pnpm public:copy-scan
          pnpm public:portability-guard
          pnpm public:readme-cta-guard

      - name: Run public git surface guard
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            node ./scripts/public-git-surface-guard.mjs \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}"
          else
            node ./scripts/public-git-surface-guard.mjs \
              --base "${{ github.event.before }}" \
              --head "${{ github.sha }}"
          fi

