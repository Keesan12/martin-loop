name: CodeRabbit Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  coderabbit:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Run CodeRabbit review
        uses: coderabbitai/ai-pr-reviewer@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODERABBIT_AI_TOKEN: ${{ secrets.CODERABBIT_AI_TOKEN }}
